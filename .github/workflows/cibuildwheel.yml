name: "Build Wheels"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.type }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      fail-fast:
        description: "Fail fast setting for building wheels."
        default: true
        required: false
        type: boolean
      deploy:
        description: "Allow deployment of build wheels."
        default: true
        required: false
        type: boolean
    secrets:
      PYPI_PASSWORD:
        description: "Token for pypi."
        required: false

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        name: Switch to using Python 3.x
        with:
          python-version: 3.x

      - name: Update pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Build sdist
        run: |
          python -m pip install "pybind11[global]"
          python setup.py sdist

      - name: Store source distribution
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: ./dist/*tar.gz
          if-no-files-found: error
          overwrite: true

      - name: Check source distribution
        run: |
          mkdir -p /tmp/installation_dir && cd /tmp/installation_dir
          python -m pip install -v $( ls ${GITHUB_WORKSPACE}/dist/*.tar.gz )
          cd /tmp && python -c "import pyPublicDecompWT"
          cd ${GITHUB_WORKSPACE}

      - name: Store package version
        id: package_version
        run: echo 'version='`pip show pyPublicDecompWT | grep "Version:" | cut -c 10-` >> "$GITHUB_OUTPUT"

  testing:
    needs: [build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Build and install
        run: pip install --verbose .[test]

      - name: Run Tests
        run: cd tests && pytest

  build-wheels:
    needs: [build_sdist]
    name: Build wheels on ${{ matrix.os }} (${{ matrix.cibw_archs }})
    runs-on: ${{ matrix.os }}
    env:
      CIBW_ARCHS_MACOS: "x86_64 arm64"
      CIBW_SKIP: "*_i686 *-win32 *-musllinux_*"
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        cibw_archs: ["auto"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version:  3.x

      - name: Install requirements
        run: |
          python -m pip install cibuildwheel

      - name: Build wheels for Python 3.10+
        run: |
          python -m cibuildwheel --output-dir dist
        env:
          CIBW_BUILD: "{c,p}p3*"
          CIBW_SKIP: "{c,p}p3{6..9}-*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BEFORE_BUILD: python -m pip install -U pip setuptools wheel
          CIBW_ARCHS: ${{ matrix.cibw_archs }}

      - name: Build wheels for Python 3.7 / 3.8 / 3.9
        run: |
          python -m cibuildwheel --output-dir dist
        env:
          CIBW_BUILD: "{c,p}p37-* {c,p}p38-* {c,p}p39-*"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          CIBW_BEFORE_BUILD: python -m pip install -U pip
          CIBW_ARCHS: ${{ matrix.cibw_archs }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.cibw_archs }}
          path: ./dist/*.whl
          if-no-files-found: error
          overwrite: true

  deploy:
    name: Deploy to PyPI
    runs-on: ubuntu-latest
    needs: [build_sdist, build-wheels, testing]
    if: ${{ inputs.deploy }}
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ needs.build_sdist.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          merge-multiple: true

      - name: Separate source distribution and wheels
        run: |
          mkdir -p dist/sdist dist/wheels
          mv dist/*.tar.gz dist/sdist/
          mv dist/*.whl dist/wheels/

      - name: Restore package version
        run: printf 'version=%s\n' "$PACKAGE_VERSION" > .package_version

      - name: Auto-add release Tags
        uses: sbrodehl/action-autotag@v3
        id: autotag
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          source_file: ".package_version"
          # this is the PEP 440 regex https://github.com/pypa/packaging/blob/21.3/packaging/version.py#L225
          # with a capture group (around everything), but all other groups are non-capturing
          # double escape's where necessary
          extraction_regex: "version\\s*=\\s*[\\'\"]*((\\d+!)?(\\d+)(\\.\\d+)*([\\.\\-\\_])?((a(lpha)?|b(eta)?|c|r(c|ev)?|pre(view)?)\\d*)?(\\.?(post|dev)\\d*)?)[\\'\"]*"
          capture_group: 1
          tag_message: "Release"
          tag_format: "v{version}"

      - name: Show version
        if: steps.autotag.outputs.tagsha
        run: echo ${{ steps.autotag.outputs.tagsha }}

      - name: Check release tag
        id: release_tag
        run: |
          git fetch --no-tags origin "refs/tags/v${PACKAGE_VERSION}"
          if [ "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Version ${PACKAGE_VERSION} is tagged at another commit; bump the version to publish these changes."
          fi

      - name: Publish source distribution to PyPI
        if: ${{ steps.release_tag.outputs.publish == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/sdist/
          skip-existing: true
          user: __token__
          password: ${{ secrets.PYPI_PASSWORD }}

      - name: Publish wheels to PyPI
        if: ${{ steps.release_tag.outputs.publish == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/wheels/
          skip-existing: true
          user: __token__
          password: ${{ secrets.PYPI_PASSWORD }}
