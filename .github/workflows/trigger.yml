name: "CI build"

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish artifacts after successful builds and tests."
        default: false
        required: false
        type: boolean
  push:
    branches:
      - 'main'
  schedule:
    - cron: '0 5 3 */2 *'

jobs:
  CIBW:
    permissions:
      contents: write
    uses: ./.github/workflows/cibuildwheel.yml
    with:
      deploy: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
    secrets:
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
